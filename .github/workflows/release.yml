name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Custom release notes / description (optional)'
        required: false
        default: ''

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            artifact_name: release-windows
            dist_cmd: npm run dist:win
          - os: ubuntu-latest
            platform: linux
            artifact_name: release-linux
            dist_cmd: npm run dist:linux
          - os: macos-latest
            platform: macos
            artifact_name: release-macos
            dist_cmd: npm run dist:mac

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsecret-1-dev libarchive-tools fuse libfuse2

      - name: Install dependencies
        run: npm ci

      - name: Run unit & integration tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Package with electron-builder
        run: ${{ matrix.dist_cmd }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Log Build Artifacts & Details
        shell: bash
        run: |
          echo "### Build Artifacts (${{ matrix.platform }})" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          ls -lh release/ | while read -r line; do
            echo "  $line"
          done
          find release/ -maxdepth 1 -type f \( -name "*.exe" -o -name "*.AppImage" -o -name "*.tar.gz" -o -name "*.zip" -o -name "*.dmg" -o -name "*.deb" \) | while read -r f; do
            fname=$(basename "$f")
            fsize=$(ls -lh "$f" | awk '{print $5}')
            echo "| \`$fname\` | $fsize |" >> $GITHUB_STEP_SUMMARY
          done

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.tar.gz
            release/*.zip
            release/*.dmg
            release/*.deb
            release/latest*.yml
          if-no-files-found: warn

  publish-release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect and stage release binaries
        run: |
          mkdir -p release-binaries
          find artifacts -type f \( -name "*.exe" -o -name "*.AppImage" -o -name "*.tar.gz" -o -name "*.zip" -o -name "*.dmg" -o -name "*.deb" -o -name "latest*.yml" \) -exec cp -v {} release-binaries/ \;
          echo "Staged release binaries:"
          ls -lh release-binaries/

      - name: Generate SHA-256 Checksums
        run: |
          cd release-binaries
          sha256sum *.exe *.AppImage *.tar.gz *.zip *.dmg *.deb 2>/dev/null > SHA256SUMS.txt || true
          cat SHA256SUMS.txt

      - name: Publish GitHub Action Summary
        run: |
          echo "## 🚀 RenegadeCMM Release Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact Binary | Size | SHA-256 Checksum |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- | --- |" >> $GITHUB_STEP_SUMMARY
          while read -r sha file; do
            if [ -n "$file" ] && [ -n "$sha" ]; then
              size=$(ls -lh "release-binaries/$file" | awk '{print $5}')
              echo "| \`$file\` | $size | \`$sha\` |" >> $GITHUB_STEP_SUMMARY
            fi
          done < release-binaries/SHA256SUMS.txt

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          files: release-binaries/*
          generate_release_notes: true
          draft: false
          prerelease: contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha')
          body: ${{ github.event.inputs.release_notes }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
